name: SuperRich 1965 rates

# This workflow publishes quotes, never website deployments. The existing
# Environment name is retained; its dedicated site PAT remains main-only.
on:
  workflow_dispatch:
    inputs:
      action:
        description: Inspect, probe, or publish a fixed single/five/all scope
        type: choice
        required: true
        default: inspect
        options:
          - inspect
          - probe
          - probe-python
          - publish-python
          - publish-five-python
          - publish-all-python
      target:
        description: Explicit reviewed quote target
        type: choice
        required: true
        default: preview-reviewed
        options:
          - preview-reviewed
          - production
  schedule:
    - cron: '0,30 1-15 * * *'

permissions:
  contents: read

# Shared by every workflow that might contact this source, independent of ref
# or target. Remote source protection still supplies the cross-runner lock.
concurrency:
  group: exchange-rates-1965-source
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'ginaz5/lingorm-map' && github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && vars.EXCHANGE_RATES_1965_SCHEDULE_ENABLED == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: superrich1965-preview
    steps:
      - name: Checkout reviewed workflow commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Install locked dependencies
        run: npm ci

      - name: Verify Python stdlib transport offline
        if: github.event_name == 'schedule' || endsWith(inputs.action, '-python')
        run: |
          python3 --version
          python3 -I -B tests/exchange-rates-1965-python-http.test.py

      - name: Run the reviewed Preview operation
        shell: bash
        env:
          ACTION_MODE: ${{ github.event_name == 'schedule' && 'publish-all-python' || inputs.action }}
          ACTION_TARGET: ${{ github.event_name == 'schedule' && 'production' || inputs.target }}
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
          EXCHANGE_RATES_1965_SCHEDULE_ENABLED: ${{ vars.EXCHANGE_RATES_1965_SCHEDULE_ENABLED }}
          EXCHANGE_RATES_1965_PRODUCTION_COMMIT: ${{ vars.EXCHANGE_RATES_1965_PRODUCTION_COMMIT }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
        run: |
          set -euo pipefail
          case "$ACTION_MODE" in
            inspect|probe|probe-python|publish-python|publish-five-python|publish-all-python) ;;
            *) exit 2 ;;
          esac
          case "$ACTION_TARGET" in
            preview-reviewed|production) ;;
            *) exit 2 ;;
          esac
          result=0
          npm run fx:1965:actions -- "$ACTION_MODE" --target "$ACTION_TARGET" || result=$?
          if [ "$result" -eq 3 ]; then
            echo 'This attempt was skipped without a new source request; review the state and reason above.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          exit "$result"
