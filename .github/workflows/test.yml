name: CI Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run Typecheck
      run: npm run typecheck

    - name: Run Tests
      run: npm run test

    - name: Test Python HTTP transport offline
      run: python3 -I -B tests/exchange-rates-1965-python-http.test.py
