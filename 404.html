<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>404 · Lingorm Map</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans TC',sans-serif;
    min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    background:#000;
    color:#fff;
    position:relative;
    text-align:center;
    padding:24px;
  }
  body::before{
    content:'';
    position:fixed;inset:0;
    background:
      linear-gradient(to bottom, rgba(0,0,0,.45) 0%, rgba(0,0,0,.25) 50%, rgba(0,0,0,.60) 100%),
      url('https://images.lingorm.pics/250830_GirlsCup/006hVBU3gy1i4wa7q6mdij32sg1uzx6q.jpeg') center/cover no-repeat;
    opacity:.8;
    z-index:0;
  }
  .card{
    position:relative;z-index:1;
    max-width:420px;
    width:100%;
  }
  .logo{
    font-size:18px;font-weight:700;
    letter-spacing:.5px;
    color:rgba(255,255,255,.85);
    margin-bottom:32px;
    display:block;
  }
  .code{
    font-size:88px;font-weight:800;
    line-height:1;
    color:#fff;
    letter-spacing:-2px;
    text-shadow:0 4px 24px rgba(0,0,0,.4);
  }
  .title{
    font-size:22px;font-weight:600;
    margin:12px 0 8px;
    color:#fff;
  }
  .sub{
    font-size:14px;
    color:rgba(255,255,255,.72);
    line-height:1.6;
    margin-bottom:32px;
  }
  .btn{
    display:inline-block;
    background:rgba(255,255,255,.18);
    border:1.5px solid rgba(255,255,255,.55);
    color:#fff;
    font-size:14px;font-weight:600;
    padding:10px 24px;
    border-radius:10px;
    text-decoration:none;
    backdrop-filter:blur(6px);
    transition:background .15s,border-color .15s;
  }
  .btn:hover{
    background:rgba(255,255,255,.30);
    border-color:#fff;
  }
  .photo-credit{
    display:block;
    margin-top:16px;
    font-size:11px;
    color:rgba(255,255,255,.5);
    text-decoration:none;
  }
  .photo-credit:hover{color:rgba(255,255,255,.85)}
</style>
</head>
<body>
  <div class="card">
    <span class="logo">🗺 Lingorm Map</span>
    <div class="code">404</div>
    <div class="title">我們翻遍了抽屜，還是找不到這個頁面。</div>
    <div class="sub">Page not found</div>
    <a class="btn" href="/">← 回地圖首頁</a>
    <a class="photo-credit" href="https://lingorm.pics/250830_GirlsCup" target="_blank" rel="noopener">📷 Photo source</a>
  </div>
</body>
</html>
