<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>Lingorm Map</title>
<link rel="icon" type="image/svg+xml" href="./favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
try {
  document.documentElement.dataset.theme = localStorage.getItem('theme') === 'dark' ? 'dark' : 'light';
} catch (_) {
  document.documentElement.dataset.theme = 'light';
}
</script>
<link rel="stylesheet" href="./styles.css"/>

new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=

<body>
<!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-NVNXGP44"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<!-- End Google Tag Manager (noscript) -->

<!-- Netlify Forms detection -->
<form class="netlify-form-probe" name="issue-report" data-netlify="true" netlify-honeypot="bot-field">
  <input name="bot-field"/><textarea name="message"></textarea>
  <input name="page_url"/><input name="contact"/>
</form>

<!-- HEADER -->
<header>
  <span class="logo cal-sans">
    <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
      <rect width="24" height="24" rx="6" fill="currentColor"/>
      <path d="M4.5 7.5v9h4" stroke="var(--canvas)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <circle cx="15" cy="12" r="4.5" stroke="var(--canvas)" stroke-width="2" fill="none"/>
    </svg>
    Lingorm Map
  </span>
  <div class="hdr-spacer"></div>
  <button class="btn-ghost" id="issue-btn">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
    <span data-i18n="issue_btn"></span>
  </button>
  <button class="btn-ghost" id="locate-btn">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/></svg>
    <span data-i18n="locate_btn_label"></span>
  </button>
  <a class="btn-ghost header-link" id="changelog-btn" href="./changelog.html">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/><path d="M12 7v5l3 2"/></svg>
    <span data-i18n="changelog_title"></span>
  </a>
  <button class="btn-ghost" id="lang-btn">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
    <span id="lang-btn-label"></span>
  </button>
  <button class="btn-ghost" id="theme-btn" type="button">
    <span class="theme-icon" aria-hidden="true">
      <svg class="theme-icon-sun" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.66 6.34l1.41-1.41"/></svg>
      <svg class="theme-icon-moon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </span>
    <span data-i18n="theme_btn"></span>
  </button>
  <div class="mobile-actions">
    <button class="mobile-actions-btn" id="mobile-actions-btn" type="button"
      aria-haspopup="menu" aria-expanded="false" aria-controls="mobile-actions-menu"
      data-i18n-aria="more_actions">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
    </button>
    <div class="mobile-actions-menu" id="mobile-actions-menu" role="menu" hidden>
      <a class="mobile-action-item" href="./changelog.html" role="menuitem">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/><path d="M12 7v5l3 2"/></svg>
        <span data-i18n="changelog_title"></span>
      </a>
      <button type="button" class="mobile-action-item" data-mobile-action="issue" role="menuitem">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        <span data-i18n="issue_btn"></span>
      </button>
      <button type="button" class="mobile-action-item" data-mobile-action="locate" role="menuitem">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/></svg>
        <span data-i18n="locate_btn_label"></span>
      </button>
    </div>
  </div>
</header>

<!-- SNACKBAR -->
<div class="snackbar" id="snackbar" role="status" aria-live="polite" aria-atomic="true"></div>

<!-- APP BODY -->
<div class="app-body">
  <div class="panel" id="panel" data-mobile-tab="list">
    <div class="filters">
      <div class="search-wrap">
        <svg viewBox="0 0 24 24"><path d="M10 2a8 8 0 1 1 0 16A8 8 0 0 1 10 2Zm0 2a6 6 0 1 0 0 12A6 6 0 0 0 10 4Zm8.586 12.172 2.828 2.828-1.414 1.414-2.828-2.828 1.414-1.414Z"/></svg>
        <input class="search-input" id="search" type="search" data-i18n-ph="search_ph" oninput="applyFilters()"/>
      </div>
      <div class="filter-row">
        <select class="filter-sel" id="cat-filter" onchange="applyFilters()"></select>
        <div class="destination-filter">
          <button class="dest-filter-btn" id="dest-filter-btn" type="button"
            aria-haspopup="dialog" aria-expanded="false" aria-controls="dest-filter-menu">
            <span id="dest-filter-label"></span>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5z"/></svg>
          </button>
          <div class="dest-filter-menu" id="dest-filter-menu" role="dialog"
            aria-labelledby="dest-filter-label" hidden>
            <div class="dest-filter-head">
              <span data-i18n="dest_filter"></span>
              <button class="dest-filter-clear" id="dest-filter-clear" type="button"
                data-i18n="clear"></button>
            </div>
            <label class="dest-option dest-all-option">
              <input type="checkbox" id="dest-filter-all">
              <span class="dest-check" aria-hidden="true"></span>
              <span data-i18n="all_destinations"></span>
            </label>
            <div class="dest-filter-groups" id="dest-filter-groups"></div>
          </div>
        </div>
        <button class="fav-filter-btn" id="fav-filter-btn" aria-pressed="false" aria-label="我的最愛">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
        </button>
      </div>
      <div class="result-meta">
        <span class="result-info" id="result-info"></span>
        <span class="last-updated" id="last-updated"></span>
      </div>
    </div>
    <div class="loc-list" id="loc-list"></div>
  </div>
  <div id="map-wrap" data-mobile-tab="list">
    <div id="map-loading" class="map-loading">
      <div>
        <div class="loading-spinner"></div>
        <p id="map-loading-msg" class="map-loading-msg"></p>
      </div>
    </div>
    <div id="map"></div>
    <div class="map-legend">
      <div class="leg-row" id="map-provider-badge">
        <div class="leg-dot" id="provider-dot"></div>
        <span id="provider-label" class="provider-label"></span>
      </div>
    </div>
  </div>
</div>

<!-- MOBILE TAB BAR -->
<div class="tab-bar">
  <button class="tab-btn" id="tab-map">
    <svg viewBox="0 0 24 24"><path d="M20.5 3l-.16.03L15 5.1 9 3 3.36 4.9c-.21.07-.36.25-.36.48V20.5c0 .28.22.5.5.5l.16-.03L9 18.9l6 2.1 5.64-1.9c.21-.07.36-.25.36-.48V3.5c0-.28-.22-.5-.5-.5zM15 19l-6-2.11V5l6 2.11V19z"/></svg>
    <span data-i18n="tab_map"></span>
  </button>
  <button class="tab-btn active" id="tab-list">
    <svg viewBox="0 0 24 24"><path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/></svg>
    <span data-i18n="tab_list"></span>
  </button>
</div>

<!-- MODAL: ISSUE REPORT -->
<div class="modal-overlay" id="issue-modal">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" data-i18n="issue_title"></span>
      <button class="modal-close">✕</button>
    </div>
    <p class="modal-desc" data-i18n="issue_desc"></p>
    <div class="modal-body">
      <div class="form-row">
        <label class="form-label"><span data-i18n="issue_lbl_message"></span><span class="required-mark"> *</span></label>
        <textarea class="form-textarea" id="issue-message" rows="4" data-i18n-ph="issue_ph_message"></textarea>
      </div>
      <div class="form-row">
        <label class="form-label">
          <span data-i18n="issue_lbl_contact"></span> <span class="lbl-opt" data-i18n="opt"></span>
        </label>
        <input class="form-input" id="issue-contact" data-i18n-ph="ph_submitter"/>
      </div>
      <div class="submit-feedback" id="issue-feedback"></div>
    </div>
    <div class="modal-footer">
      <button class="btn-ghost" id="issue-cancel-btn" data-i18n="cancel"></button>
      <button class="btn-primary" id="issue-submit-btn" data-i18n="issue_submit"></button>
    </div>
  </div>
</div>

<!-- MODAL: WHAT'S NEW -->
<div class="modal-overlay" id="whats-new-modal">
  <div class="modal modal-sm">
    <div class="modal-header">
      <span class="modal-title" id="wn-title"></span>
      <button class="modal-close" id="wn-close-btn" aria-label="關閉">✕</button>
    </div>
    <p class="modal-desc" id="wn-desc"></p>
    <div class="modal-body" id="wn-list"></div>
    <div class="modal-footer">
      <a class="btn-secondary" id="wn-changelog-link" href="./changelog.html"></a>
      <button class="btn-primary" id="wn-got-it-btn"></button>
    </div>
  </div>
</div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
