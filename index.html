<!DOCTYPE html>
<html lang="zh-TW" data-theme="auto">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>Lingorm Bangkok Map</title>
<link rel="stylesheet" href="./styles.css"/>
</head>
<body>

<!-- Netlify Forms detection -->
<form class="netlify-form-probe" name="suggest-edit" data-netlify="true" netlify-honeypot="bot-field">
  <input name="bot-field"/><input name="location_name"/><input name="location_index"/>
  <input name="suggested_status"/><input name="maps_query"/><input name="lat"/><input name="lng"/>
  <textarea name="notes_zh"></textarea><textarea name="notes_en"></textarea>
  <textarea name="reason"></textarea><input name="submitter"/>
</form>
<form class="netlify-form-probe" name="add-location" data-netlify="true" netlify-honeypot="bot-field">
  <input name="bot-field"/><input name="name_zh"/><input name="name_en"/><input name="alt_name"/>
  <input name="icon"/><input name="category_zh"/><input name="category_en"/>
  <input name="lat"/><input name="lng"/><input name="maps_query"/>
  <textarea name="notes_zh"></textarea><textarea name="notes_en"></textarea>
  <input name="status"/><input name="source_url"/><input name="submitter"/>
</form>

<!-- HEADER -->
<header>
  <span class="logo">🗺 Lingorm BKK</span>
  <div class="hdr-spacer"></div>
  <button class="hdr-btn btn-add" onclick="openAddModal()">
    <span>＋</span><span data-i18n="add_loc"></span>
  </button>
  <button class="hdr-btn" id="lang-btn" onclick="toggleLang()"></button>
  <button class="hdr-btn icon-btn" id="theme-btn" onclick="cycleTheme()">🌙</button>
</header>

<!-- Pending banner -->
<div class="pending-banner" id="pending-banner">
  <span>⏳</span><span data-i18n="pending_notice"></span>
</div>

<!-- APP BODY -->
<div class="app-body">
  <div class="panel" id="panel" data-mobile-tab="list">
    <div class="filters">
      <div class="search-wrap">
        <svg viewBox="0 0 24 24"><path d="M10 2a8 8 0 1 1 0 16A8 8 0 0 1 10 2Zm0 2a6 6 0 1 0 0 12A6 6 0 0 0 10 4Zm8.586 12.172 2.828 2.828-1.414 1.414-2.828-2.828 1.414-1.414Z"/></svg>
        <input class="search-input" id="search" type="search" data-i18n-ph="search_ph" oninput="applyFilters()"/>
      </div>
      <div class="filter-row">
        <select class="filter-sel" id="cat-filter" onchange="applyFilters()"></select>
        <select class="filter-sel" id="status-filter" onchange="applyFilters()"></select>
      </div>
      <div class="result-info" id="result-info"></div>
    </div>
    <div class="loc-list" id="loc-list"></div>
  </div>
  <div id="map-wrap" data-mobile-tab="list">
    <div id="map"></div>
    <div class="map-legend">
      <div class="leg-row"><div class="leg-dot verified"></div><span data-i18n="leg_verified"></span></div>
      <div class="leg-row"><div class="leg-dot review"></div><span data-i18n="leg_review"></span></div>
      <div class="leg-row"><div class="leg-dot notfound"></div><span data-i18n="leg_notfound"></span></div>
    </div>
  </div>
</div>

<!-- MOBILE TAB BAR -->
<div class="tab-bar">
  <button class="tab-btn" id="tab-map" onclick="switchTab('map')">
    <svg viewBox="0 0 24 24"><path d="M20.5 3l-.16.03L15 5.1 9 3 3.36 4.9c-.21.07-.36.25-.36.48V20.5c0 .28.22.5.5.5l.16-.03L9 18.9l6 2.1 5.64-1.9c.21-.07.36-.25.36-.48V3.5c0-.28-.22-.5-.5-.5zM15 19l-6-2.11V5l6 2.11V19z"/></svg>
    <span data-i18n="tab_map"></span>
  </button>
  <button class="tab-btn active" id="tab-list" onclick="switchTab('list')">
    <svg viewBox="0 0 24 24"><path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/></svg>
    <span data-i18n="tab_list"></span>
  </button>
</div>

<!-- MODAL: SUGGEST EDIT -->
<div class="modal-overlay" id="edit-modal" onclick="if(event.target===this)closeEditModal()">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" data-i18n="edit_title"></span>
      <button class="modal-close" onclick="closeEditModal()">✕</button>
    </div>
    <p class="modal-desc" data-i18n="edit_desc"></p>
    <div class="modal-body">
      <div class="form-row">
        <label class="form-label" data-i18n="edit_lbl_location"></label>
        <input class="form-input form-input-readonly" id="edit-location-name" readonly/>
        <input type="hidden" id="edit-location-index"/>
      </div>
      <div class="form-row">
        <label class="form-label" data-i18n="edit_lbl_status"></label>
        <div class="status-opts">
          <input class="status-opt" type="radio" name="suggest-status" id="so-verified" value="Verified"/>
          <label for="so-verified" data-i18n="st_verified"></label>
          <input class="status-opt" type="radio" name="suggest-status" id="so-review" value="Needs Review" checked/>
          <label for="so-review" data-i18n="st_review"></label>
          <input class="status-opt" type="radio" name="suggest-status" id="so-notfound" value="Could Not Find"/>
          <label for="so-notfound" data-i18n="st_notfound"></label>
        </div>
      </div>
      <div class="form-row">
        <label class="form-label">
          <span data-i18n="edit_lbl_maps"></span> <span class="lbl-opt" data-i18n="opt"></span>
        </label>
        <input class="form-input" id="edit-maps" data-i18n-ph="edit_ph_maps"/>
        <div class="form-hint" data-i18n="edit_hint_maps"></div>
      </div>
      <div class="form-2col">
        <div class="form-row">
          <label class="form-label">
            <span data-i18n="edit_lbl_lat"></span> <span class="lbl-opt" data-i18n="opt"></span>
          </label>
          <input class="form-input" id="edit-lat" type="number" step="any" placeholder="13.7466"/>
        </div>
        <div class="form-row">
          <label class="form-label">
            <span data-i18n="edit_lbl_lng"></span> <span class="lbl-opt" data-i18n="opt"></span>
          </label>
          <input class="form-input" id="edit-lng" type="number" step="any" placeholder="100.5344"/>
        </div>
      </div>
      <div class="form-hint coords-hint" data-i18n="edit_hint_coords"></div>
      <div class="form-row">
        <label class="form-label">
          <span data-i18n="edit_lbl_notes_zh"></span> <span class="lbl-opt" data-i18n="opt"></span>
        </label>
        <textarea class="form-textarea" id="edit-notes-zh" rows="2" data-i18n-ph="edit_ph_notes_zh"></textarea>
      </div>
      <div class="form-row">
        <label class="form-label">
          <span data-i18n="edit_lbl_notes_en"></span> <span class="lbl-opt" data-i18n="opt"></span>
        </label>
        <textarea class="form-textarea" id="edit-notes-en" rows="2" data-i18n-ph="edit_ph_notes_en"></textarea>
      </div>
      <div class="form-row">
        <label class="form-label">
          <span data-i18n="edit_lbl_reason"></span> <span class="lbl-opt" data-i18n="opt"></span>
        </label>
        <textarea class="form-textarea" id="edit-reason" rows="2" data-i18n-ph="edit_ph_reason"></textarea>
      </div>
      <hr class="form-divider"/>
      <div class="form-row">
        <label class="form-label">
          <span data-i18n="edit_lbl_submitter"></span> <span class="lbl-opt" data-i18n="edit_lbl_submitter_opt"></span>
        </label>
        <input class="form-input" id="edit-submitter" data-i18n-ph="ph_submitter"/>
      </div>
      <div class="submit-feedback" id="edit-feedback"></div>
    </div>
    <div class="modal-footer">
      <button class="btn-ghost" onclick="closeEditModal()" data-i18n="cancel"></button>
      <button class="btn-primary" id="edit-submit-btn" onclick="submitEdit()" data-i18n="edit_submit"></button>
    </div>
  </div>
</div>

<!-- MODAL: ADD LOCATION -->
<div class="modal-overlay" id="add-modal" onclick="if(event.target===this)closeAddModal()">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" data-i18n="add_title"></span>
      <button class="modal-close" onclick="closeAddModal()">✕</button>
    </div>
    <p class="modal-desc" id="add-modal-desc" data-i18n="add_desc"></p>
    <div class="modal-body">
      <div id="add-form-view">
        <div class="form-row">
          <label class="form-label"><span data-i18n="add_lbl_name"></span><span class="required-mark"> *</span></label>
          <input class="form-input" id="add-name" data-i18n-ph="add_ph_name"/>
        </div>
        <div class="form-row">
          <label class="form-label" data-i18n="add_lbl_cat"></label>
          <select class="form-select" id="add-cat"></select>
        </div>
        <div class="form-row">
          <label class="form-label"><span data-i18n="add_lbl_maps"></span><span class="required-mark"> *</span></label>
          <input class="form-input" id="add-maps" data-i18n-ph="add_ph_maps" type="url"/>
          <div class="form-hint" data-i18n="add_hint_maps"></div>
        </div>
        <div class="form-row">
          <label class="form-label"><span data-i18n="add_lbl_notes"></span> <span class="lbl-opt" data-i18n="opt"></span></label>
          <textarea class="form-textarea" id="add-notes" rows="2" data-i18n-ph="add_ph_notes"></textarea>
        </div>
        <div class="form-row">
          <label class="form-label" data-i18n="add_lbl_status"></label>
          <div class="status-opts">
            <input class="status-opt" type="radio" name="new-status" id="ns-verified" value="Verified"/>
            <label for="ns-verified" data-i18n="st_verified"></label>
            <input class="status-opt" type="radio" name="new-status" id="ns-review" value="Needs Review" checked/>
            <label for="ns-review" data-i18n="st_review"></label>
            <input class="status-opt" type="radio" name="new-status" id="ns-notfound" value="Could Not Find"/>
            <label for="ns-notfound" data-i18n="st_notfound"></label>
          </div>
        </div>
        <hr class="form-divider"/>
        <div class="form-row">
          <label class="form-label">
            <span data-i18n="add_lbl_source"></span> <span class="lbl-opt" data-i18n="add_lbl_source_opt"></span>
          </label>
          <input class="form-input" id="add-source" type="url" placeholder="https://www.instagram.com/p/..."/>
        </div>
        <div class="form-row">
          <label class="form-label">
            <span data-i18n="add_lbl_submitter"></span> <span class="lbl-opt" data-i18n="opt"></span>
          </label>
          <input class="form-input" id="add-submitter" data-i18n-ph="ph_submitter"/>
        </div>
        <div class="submit-feedback" id="add-feedback"></div>
      </div>
      <div class="success-view" id="add-success-view">
        <div class="success-icon">✓</div>
        <h3 data-i18n="add_success_title"></h3>
        <p data-i18n="add_success_desc"></p>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-ghost" id="add-cancel-btn" onclick="closeAddModal()" data-i18n="cancel"></button>
      <button class="btn-primary" id="add-submit-btn" onclick="submitAdd()" data-i18n="add_submit"></button>
      <button class="btn-primary" id="add-done-btn" onclick="closeAddModal()" data-i18n="done"></button>
    </div>
  </div>
</div>

<!-- MODAL: ADMIN AUTH -->
<div class="modal-overlay" id="admin-auth-modal" onclick="if(event.target===this)closeAdminAuth()">
  <div class="modal modal-sm">
    <div class="modal-header">
      <span class="modal-title" data-i18n="admin_title"></span>
      <button class="modal-close" onclick="closeAdminAuth()">✕</button>
    </div>
    <p class="modal-desc" data-i18n="admin_desc"></p>
    <div class="modal-body">
      <div class="form-row">
        <label class="form-label" data-i18n="admin_lbl"></label>
        <input class="form-input" id="admin-pwd" type="password" data-i18n-ph="admin_ph"
          onkeydown="if(event.key==='Enter')verifyAdminPassword()"/>
      </div>
      <div class="submit-feedback" id="admin-feedback"></div>
    </div>
    <div class="modal-footer">
      <button class="btn-ghost" onclick="closeAdminAuth()" data-i18n="cancel"></button>
      <button class="btn-primary" onclick="verifyAdminPassword()" data-i18n="admin_btn"></button>
    </div>
  </div>
</div>

<!-- MODAL: SHEET SETTINGS (admin only) -->
<div class="modal-overlay" id="sheet-modal" onclick="if(event.target===this)closeSheetModal()">
  <div class="modal modal-sheet">
    <div class="modal-header">
      <span class="modal-title" data-i18n="sheet_title"></span>
      <button class="modal-close" onclick="closeSheetModal()">✕</button>
    </div>
    <p class="modal-desc" data-i18n="sheet_desc"></p>
    <div class="modal-body">
      <div class="sheet-status" id="sheet-status"></div>
      <div class="sheet-help sheet-help-spaced" data-i18n-html="sheet_howto"></div>
      <hr class="form-divider"/>
      <div class="sheet-help" data-i18n-html="sheet_netlify"></div>
    </div>
    <div class="modal-footer">
      <button class="btn-ghost" onclick="closeSheetModal()" data-i18n="cancel"></button>
      <button class="btn-primary" onclick="saveSheet()" data-i18n="sheet_save"></button>
    </div>
  </div>
</div>

function t(k, ...a) { const v = T[lang][k]; return typeof v === 'function' ? v(...a) : (v ?? k); }
function tobj(k, s) { return (T[lang][k] || {})[s] || s; }


const C={EN:0,ZH:1,ALT:2,CAT_EN:3,CAT_ZH:4,NOTES_EN:5,NOTES_ZH:6,
         ICON:7,LAT:8,LNG:9,MAPS:10,STATUS:11,DUP:12,SRC:13,APPROX:14,SOURCE_URL:15};

const CATEGORY_ALIASES = {
  "Hotel": {en:"Hotel", zh:"飯店"},
  "酒店": {en:"Hotel", zh:"飯店"},
  "飯店": {en:"Hotel", zh:"飯店"},
  "Bar": {en:"Bar / Rooftop Club", zh:"酒吧/天台俱樂部"},
  "酒吧": {en:"Bar / Rooftop Club", zh:"酒吧/天台俱樂部"},

  "酒吧/俱樂部": {en:"Bar / Rooftop Club", zh:"酒吧/天台俱樂部"},
  "Bar / Rooftop Club": {en:"Bar / Rooftop Club", zh:"酒吧/天台俱樂部"},

  "酒吧/天台俱樂部": {en:"Bar / Rooftop Club", zh:"酒吧/天台俱樂部"},
  "Cafe / Juice Bar":  {en:"Beverages", zh:"飲料"},
  "Cafe / Beverage":   {en:"Beverages", zh:"飲料"},

  "咖啡廳/果汁":        {en:"Beverages", zh:"飲料"},

  "咖啡廳/飲品":        {en:"Beverages", zh:"飲料"},
};

function normalizeCategoryRow(row){
  const normalized=[...row];
  const alias=CATEGORY_ALIASES[normalized[C.CAT_EN]]||CATEGORY_ALIASES[normalized[C.CAT_ZH]];
  if(alias){
    normalized[C.CAT_EN]=alias.en;
    normalized[C.CAT_ZH]=alias.zh;
  }
  return normalized;
}

function normalizeCategoryRows(rows){
  return rows.map(normalizeCategoryRow);
}

// ═══════════════════════════════════════════════════
// CSV PARSER
// ═══════════════════════════════════════════════════
function parseCSV(text){
  const rows=[];let row=[];let field='';let inQ=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i],nx=text[i+1];
    if(inQ){if(ch==='"'&&nx==='"'){field+='"';i++}else if(ch==='"'){inQ=false}else{field+=ch}}
    else{if(ch==='"'){inQ=true}else if(ch===','){row.push(field);field=''}
      else if(ch==='\r'&&nx==='\n'){row.push(field);rows.push(row);row=[];field='';i++}
      else if(ch==='\n'||ch==='\r'){row.push(field);rows.push(row);row=[];field=''}
      else{field+=ch}}
  }
  if(field||row.length){row.push(field);rows.push(row)}
  if(rows.length<2)return null;
  const headers=rows[0].map(h=>h.replace(/^\uFEFF/,'').trim());
  const idx={};headers.forEach((h,i)=>idx[h]=i);
  const keys=["Name_EN","Name_ZH","Alt_Name","Category_EN","Category_ZH",
              "Notes_EN","Notes_ZH","Icon","Lat","Lng",
              "Maps_Query","Status","Duplicate_Group","Source","Coords_Approx","Source_URL"];
  const read=(r,k)=>(idx[k]!==undefined?r[idx[k]]||'':'').trim();
  const present=ks=>ks.every(k=>idx[k]!==undefined);
  // Source_URL is optional — only fail validation if core keys are missing
  const coreKeys=keys.slice(0,15);
  if(present(coreKeys)){
    return normalizeCategoryRows(rows.slice(1).filter(r=>r.join('').trim()).map(r=>keys.map(k=>read(r,k))));
  }

  const publishedKeys=["Location Name","Thai / Alt Name","Category",
                       "Notes","Source URL","Verification Status","Duplicate Group"];
  if(!present(publishedKeys))return null;

  const iconByCat={
    "Restaurant":"🍽","Cafe":"☕","Cafe / Beverage":"🧋","Cafe / Juice Bar":"🥤",
    "Hotel":"🏨","Bar":"🍸","Bar / Club":"🍸","Bar / Rooftop Club":"🏖️","Spa":"♨️",
    "Shopping":"🛍","Activity":"🎯","Filming Location":"🎬",
    "Nature / Day-trip":"🌿","Street Food":"🍜","Neighbourhood":"🏘️"
  };
  const zhByCat={
    "Restaurant":"餐廳","Cafe":"咖啡廳","Cafe / Beverage":"飲料","Cafe / Juice Bar":"飲料","Beverages":"飲料",
    "Hotel":"飯店","Bar":"酒吧/天台俱樂部","Bar / Club":"酒吧/天台俱樂部","Bar / Rooftop Club":"酒吧/天台俱樂部","Spa":"Spa",
    "Shopping":"購物","Activity":"活動","Filming Location":"拍攝場地",
    "Nature / Day-trip":"自然 / 一日遊","Street Food":"街頭小吃","Neighbourhood":"街區"
  };
  const normalizeStatus=s=>{
    const raw=s.trim();
    if(raw==="Verified"||raw==="Needs Review"||raw==="Could Not Find")return raw;
    if(/verified/i.test(raw))return "Verified";
    if(/could not find|not found/i.test(raw))return "Could Not Find";
    return "Needs Review";
  };
  const sourceLabel=url=>{
    if(!url)return "";
    const host=(url.match(/^https?:\/\/([^/]+)/i)||[])[1]||"";
    if(/kkday/i.test(host))return "KKday";
    if(/trip\.com/i.test(host))return "Trip.com";
    if(/threads/i.test(host))return "Threads";
    if(/instagram/i.test(host))return "Instagram";
    if(/youtube|youtu\.be/i.test(host))return "YouTube";
    return "Source";
  };
  const normalizeSourceTags=tags=>{
    return tags.split(',').map(s=>s.trim())
      .filter(s=>s&&!/^https?:\/\//i.test(s))
      .join(' + ');
  };
  const mapsQuery=(name,maps)=>{
    if(maps&&!/open in maps/i.test(maps)&&!/^📍/.test(maps))return maps;
    return name?`${name} Bangkok`:"";
  };
  return normalizeCategoryRows(rows.slice(1).filter(r=>r.join('').trim()&&!/^source note$/i.test(read(r,"Category"))).map(r=>{
    const name=read(r,"Location Name");
    const nameZh=read(r,"Location Name ZH")||name;
    const cat=(CATEGORY_ALIASES[read(r,"Category")]||{en:read(r,"Category")}).en;
    const notes=read(r,"Notes");
    const notesZh=read(r,"Notes ZH")||notes;
    const sourceUrl=read(r,"Source URL");
    const sourceTags=normalizeSourceTags(read(r,"Source Tags"));
    const maps=read(r,"Google Maps URL")||read(r,"Google Maps Link");
    return [
      name,nameZh,read(r,"Thai / Alt Name"),
      cat,zhByCat[cat]||cat,
      notes,notesZh,
      read(r,"Icon")||iconByCat[cat]||"📍",
      read(r,"Lat"),read(r,"Lng"),
      mapsQuery(name,maps),
      normalizeStatus(read(r,"Verification Status")),
      read(r,"Duplicate Group"),
      sourceTags||sourceLabel(sourceUrl),
      read(r,"Coordinates Approx")||"TRUE",
      sourceUrl
    ];
  }));
}

let data=[], visIdx=[], activeIdx=-1;

// ═══════════════════════════════════════════════════
// MAP (Google Maps JS API)
// ═══════════════════════════════════════════════════
let map = null;
let infoWindow = null;
let googleMapId = null;
const markers = [];

function getEffectiveTheme(){
  const s=localStorage.getItem('theme')||'auto';
  return s==='auto'?(window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):s;
}
function updateMapTheme(){
  if(!map)return;
  map.setOptions({colorScheme:getEffectiveTheme()==='dark'?'DARK':'LIGHT'});
}
function makeMarkerContent(status){
  const el=document.createElement('div');
  el.className=`marker-dot ${getBadgeClass(status).replace('b-','marker-')}`;
  return el;
}
function buildPopupContent(i){
  const row=data[i];
  const name=lang==='zh'?row[C.ZH]:row[C.EN];
  const notes=lang==='zh'?row[C.NOTES_ZH]:row[C.NOTES_EN];
  const cat=lang==='zh'?row[C.CAT_ZH]:row[C.CAT_EN];
  return `<div class="popup-content">
    <div class="popup-name">${row[C.ICON]} ${name}</div>
    ${row[C.ALT]?`<div class="popup-alt">${row[C.ALT]}</div>`:''}
    <div class="badges popup-badges">
      <span class="badge b-cat">${cat}</span>
      <span class="badge ${getBadgeClass(row[C.STATUS])}">${tobj('badge',row[C.STATUS])}</span>
    </div>
    <div class="popup-notes">${notes}</div>
    ${renderSources(row)}
  </div>`;
}
function buildMarkers(){
  if(!map)return;
  markers.forEach(m=>{if(m)m.map=null});markers.length=0;
  data.forEach((row,i)=>{
    const lat=parseFloat(row[C.LAT]),lng=parseFloat(row[C.LNG]);
    if(!lat||!lng)return;
    const m=new google.maps.marker.AdvancedMarkerElement({
      map,position:{lat,lng},content:makeMarkerContent(row[C.STATUS])
    });
    m.addListener('click',()=>{
      infoWindow.setContent(buildPopupContent(i));
      infoWindow.open({anchor:m,map});
      activateCard(i);
      if(window.innerWidth<=700)switchTab('list');
    });
    markers[i]=m;
  });
}

// Called by Google Maps script after it loads
window.initMapCallback=function(){
  map=new google.maps.Map(document.getElementById('map'),{
    center:{lat:13.82,lng:100.52},zoom:11,
    mapId:googleMapId,
    colorScheme:getEffectiveTheme()==='dark'?'DARK':'LIGHT',
    zoomControlOptions:{position:google.maps.ControlPosition.RIGHT_CENTER}
  });
  infoWindow=new google.maps.InfoWindow();
  buildMarkers();
};

async function loadGoogleMapsScript(){
  try{
    const resp=await fetch('/api/config');if(!resp.ok)throw new Error(resp.status);
    const cfg=await resp.json();
    googleMapId=cfg.googleMapId;
    const script=document.createElement('script');
    script.async=true;
    script.src='https://maps.googleapis.com/maps/api/js?key='+
      encodeURIComponent(cfg.googleMapsKey)+
      '&map_ids='+encodeURIComponent(cfg.googleMapId)+
      '&libraries=marker&callback=initMapCallback&loading=async';
    document.body.appendChild(script);
  }catch(e){
    console.error('Google Maps config failed',e);
  }
}

// ═══════════════════════════════════════════════════
// CARD LIST
// ═══════════════════════════════════════════════════
function getBadgeClass(s){
  if(s==='Verified')return 'b-verified';
  if(s==='Could Not Find')return 'b-notfound';
  return 'b-review';
}
function applyFilters(){
  const q=document.getElementById('search').value.toLowerCase();
  const cat=document.getElementById('cat-filter').value;
  const st=document.getElementById('status-filter').value;
  visIdx=[];
  data.forEach((row,i)=>{
    const nameHit=(row[C.EN]+row[C.ZH]+row[C.ALT]).toLowerCase().includes(q);
    const notesHit=(row[C.NOTES_EN]+row[C.NOTES_ZH]).toLowerCase().includes(q);
    // cat filter: compare against both zh and en to handle sheet-loaded data
    const catVal=lang==='zh'?row[C.CAT_ZH]:row[C.CAT_EN];
    const catHit=!cat||catVal===cat;
    const stHit=!st||row[C.STATUS]===st;
    if((nameHit||notesHit)&&catHit&&stHit)visIdx.push(i);
  });
  renderList();
  document.getElementById('result-info').textContent=t('count',visIdx.length,data.length);
}
function renderSources(row){
  const src=row[C.SRC]||'';
  const srcUrl=row[C.SOURCE_URL]||'';
  if(!src)return '';
  const tokens=src.split(/\s*[+,]\s*/).map(s=>s.trim()).filter(Boolean);
  const urls=srcUrl.split(/\s*,\s*/).map(s=>s.trim()).filter(Boolean);
  const tags=tokens.map((token,idx)=>{
    const labelFor=(label,url)=>{
      if(label==='Threads'){
        const handle=(url.match(/threads\.(?:com|net)\/@([^/?#]+)/i)||[])[1];
        if(handle)return `Threads @${handle}`;
      }
      return label;
    };
    // Match "@handle" or "Threads @handle" — link to specific post (srcUrl) if available, else profile
    const handleMatch=token.match(/@(\S+)$/);
    if(handleMatch){
      const url=urls[idx]||urls[0]||`https://www.threads.net/@${handleMatch[1]}`;
      return `<a class="src-tag" href="${url}" target="_blank" onclick="event.stopPropagation()">${token}</a>`;
    }
    // KKday / Trip.com etc — use Source_URL if available, else platform fallback
    const PLATFORM_URLS={'KKday':'https://www.kkday.com','Trip.com':'https://www.trip.com','Threads':'https://www.threads.net','Douban':'https://www.douban.com','Google Maps':'https://maps.google.com'};
    const url=urls[idx]||urls[0]||PLATFORM_URLS[token]||'';
    if(url){
      return `<a class="src-tag" href="${url}" target="_blank" onclick="event.stopPropagation()">${labelFor(token,url)}</a>`;
    }
    return `<span class="src-tag src-tag-plain">${token}</span>`;
  });
  return `<div class="src-tags">${tags.join('')}</div>`;
}
function renderList(){
  const list=document.getElementById('loc-list');
  if(!visIdx.length){list.innerHTML=`<div class="empty"><div class="empty-icon">🔍</div>${t('empty')}</div>`;return}
  list.innerHTML=visIdx.map(i=>{
    const row=data[i];
    const name=lang==='zh'?row[C.ZH]:row[C.EN];
    const notes=lang==='zh'?row[C.NOTES_ZH]:row[C.NOTES_EN];
    const cat=lang==='zh'?row[C.CAT_ZH]:row[C.CAT_EN];
    const st=row[C.STATUS];
    const needsHelp=st==='Needs Review'||st==='Could Not Find';
    return `<div class="loc-card${activeIdx===i?' active':''}" id="card-${i}" onclick="activateCard(${i})">
      <div class="card-head">
        <div class="card-icon">${row[C.ICON]}</div>
        <div class="card-title-wrap">
          <div class="card-name">${name}</div>
          ${row[C.ALT]?`<div class="card-alt">${row[C.ALT]}</div>`:''}
        </div>
      </div>
      <div class="badges">
        <span class="badge b-cat">${cat}</span>
        <span class="badge ${getBadgeClass(st)}">${tobj('badge',st)}</span>
        ${row[C.DUP]?`<span class="badge b-dup">${row[C.DUP]}</span>`:''}
      </div>
      <div class="card-notes">${notes}</div>
      ${renderSources(row)}
      <div class="card-footer">
        <span></span>
        <button class="card-edit-btn${needsHelp?' verify-hint':''}"
          onclick="event.stopPropagation();openEditModal(${i})">
          ${needsHelp?t('edit_btn_verify'):t('edit_btn_edit')}
        </button>
      </div>
    </div>`;
  }).join('');
}
function activateCard(i){
  activeIdx=i;
  const row=data[i];
  const lat=parseFloat(row[C.LAT]),lng=parseFloat(row[C.LNG]);
  if(lat&&lng&&map){
    map.panTo({lat,lng});map.setZoom(15);
    if(markers[i]){infoWindow.setContent(buildPopupContent(i));infoWindow.open({anchor:markers[i],map});}
  }
  document.querySelectorAll('.loc-card').forEach(c=>c.classList.remove('active'));
  const card=document.getElementById('card-'+i);
  if(card){card.classList.add('active');card.scrollIntoView({behavior:'smooth',block:'nearest'})}
}

function toggleLang(){
  lang=lang==='zh'?'en':'zh';localStorage.setItem('lang',lang);
  updateLangUI();
  buildCatFilter();buildCatDropdown();
  applyFilters();
  if(infoWindow&&activeIdx>=0&&markers[activeIdx]){infoWindow.setContent(buildPopupContent(activeIdx));}
}

function updateLangUI(){
  // data-i18n: textContent
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const v=t(el.dataset.i18n);
    if(v!==el.dataset.i18n)el.textContent=v;
  });
  // data-i18n-html: innerHTML
  document.querySelectorAll('[data-i18n-html]').forEach(el=>{
    const v=t(el.dataset.i18nHtml);
    if(v!==el.dataset.i18nHtml)el.innerHTML=v;
  });
  // data-i18n-ph: placeholder
  document.querySelectorAll('[data-i18n-ph]').forEach(el=>{
    const v=t(el.dataset.i18nPh);
    if(v!==el.dataset.i18nPh)el.placeholder=v;
  });
  // lang button
  document.getElementById('lang-btn').textContent=t('lang_btn');
  // status filter rebuild
  buildStatusFilter();
}

function buildStatusFilter(){
  const sf=document.getElementById('status-filter');
  const prev=sf.value;
  sf.innerHTML=`<option value="">${t('all_status')}</option>`+
    Object.entries(t('status')).map(([k,v])=>`<option value="${k}">${v}</option>`).join('');
  sf.value=prev;
}

function buildCatFilter(){
  const sel=document.getElementById('cat-filter');
  const prev=sel.value;
  const cats=new Set();
  data.forEach(r=>cats.add(lang==='zh'?r[C.CAT_ZH]:r[C.CAT_EN]));
  sel.innerHTML=`<option value="">${t('all_cat')}</option>`+
    [...cats].sort().map(c=>`<option value="${c}">${c}</option>`).join('');
  sel.value=prev;
}

function buildCatDropdown(){
  const sel=document.getElementById('add-cat');
  const prev=sel.value;
  sel.innerHTML=CATEGORIES.map(c=>
    `<option value="${c.en}">${c.icon} ${lang==='zh'?c.zh:c.en}</option>`
  ).join('');
  if(prev)sel.value=prev;
}

const THEME_ICONS={light:'☀️',dark:'🌙',auto:'🌓'};
function cycleTheme(){
  const cur=localStorage.getItem('theme')||'auto';
  localStorage.setItem('theme',cur==='auto'?'light':cur==='light'?'dark':'auto');
  applyTheme();
}
function applyTheme(){
  document.documentElement.setAttribute('data-theme',getEffectiveTheme());
  document.getElementById('theme-btn').textContent=THEME_ICONS[localStorage.getItem('theme')||'auto'];
  updateMapTheme();
}
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{
  if((localStorage.getItem('theme')||'auto')==='auto')applyTheme();
});

  document.getElementById('panel').setAttribute('data-mobile-tab',tab==='map'?'map':'list');

function openEditModal(i){
  const row=data[i];
  const name=lang==='zh'?row[C.ZH]:row[C.EN];
  document.getElementById('edit-location-name').value=`${row[C.ICON]} ${name}`;
  document.getElementById('edit-location-index').value=i;
  document.getElementById('edit-maps').value=row[C.MAPS].replace(/\+/g,' ');
  document.getElementById('edit-lat').value=row[C.LAT]||'';
  document.getElementById('edit-lng').value=row[C.LNG]||'';
  ['edit-notes-zh','edit-notes-en','edit-reason','edit-submitter'].forEach(id=>document.getElementById(id).value='');
  const st=row[C.STATUS];
  document.getElementById('so-verified').checked=st==='Verified';
  document.getElementById('so-review').checked=st==='Needs Review';
  document.getElementById('so-notfound').checked=st==='Could Not Find';
  resetFeedback('edit-feedback','edit-submit-btn',t('edit_submit'));
  document.getElementById('edit-modal').classList.add('open');
}
function closeEditModal(){document.getElementById('edit-modal').classList.remove('open')}
async function submitEdit(){
  const idx=parseInt(document.getElementById('edit-location-index').value);
  const row=data[idx];
  await doNetlifySubmit('edit-submit-btn','edit-feedback',t('edit_submit'),{
    'form-name':'suggest-edit','bot-field':'',
    location_name:`${row[C.ZH]} / ${row[C.EN]}`,
    location_index:idx,
    suggested_status:document.querySelector('input[name="suggest-status"]:checked')?.value||'',
    maps_query:document.getElementById('edit-maps').value.trim(),
    lat:document.getElementById('edit-lat').value.trim(),
    lng:document.getElementById('edit-lng').value.trim(),
    notes_zh:document.getElementById('edit-notes-zh').value.trim(),
    notes_en:document.getElementById('edit-notes-en').value.trim(),
    reason:document.getElementById('edit-reason').value.trim(),
    submitter:document.getElementById('edit-submitter').value.trim(),
  },'edit-modal');
}

// ═══════════════════════════════════════════════════
// ADD MODAL
// ═══════════════════════════════════════════════════
const ADD_LOCATION_INPUT_IDS=['add-name','add-maps','add-notes','add-source','add-submitter'];

function openAddModal(){
  ADD_LOCATION_INPUT_IDS.forEach(id=>
    document.getElementById(id).value='');
  document.getElementById('ns-review').checked=true;
  document.getElementById('add-modal').classList.remove('is-success');
  resetFeedback('add-feedback','add-submit-btn',t('add_submit'));
  document.getElementById('add-modal').classList.add('open');
}
function closeAddModal(){document.getElementById('add-modal').classList.remove('open','is-success')}
function showAddSuccess(){
  document.getElementById('add-modal').classList.add('is-success');
  resetFeedback('add-feedback','add-submit-btn',t('add_submit'));
}
function validateAddLocation(name,maps){
  if(!name)return 'err_name_required';
  if(!maps)return 'err_maps_required';
  return '';
}
function buildAddLocationPayload(){
  const name=document.getElementById('add-name').value.trim();
  const maps=document.getElementById('add-maps').value.trim();
  const catSel=document.getElementById('add-cat');
  const catIdx=catSel.selectedIndex;
  const catObj=CATEGORIES[catIdx]||{zh:'',en:catSel.value};
  const notes=document.getElementById('add-notes').value.trim();
  return {
    'form-name':'add-location','bot-field':'',
    name_zh:lang==='zh'?name:'',name_en:lang==='en'?name:'',
    alt_name:'',icon:'',
    category_zh:catObj.zh,category_en:catObj.en,
    lat:'',lng:'',
    maps_query:maps,
    notes_zh:lang==='zh'?notes:'',notes_en:lang==='en'?notes:'',
    status:document.querySelector('input[name="new-status"]:checked')?.value||'Needs Review',
    source_url:document.getElementById('add-source').value.trim(),
    submitter:document.getElementById('add-submitter').value.trim(),
  };
}
async function submitAdd(){
  const name=document.getElementById('add-name').value.trim();
  const maps=document.getElementById('add-maps').value.trim();
  const fb=document.getElementById('add-feedback');
  const errorKey=validateAddLocation(name,maps);
  if(errorKey){fb.className='submit-feedback err';fb.textContent=t(errorKey);return}
  await doNetlifySubmit('add-submit-btn','add-feedback',t('add_submit'),buildAddLocationPayload(),'add-modal');
}

// ═══════════════════════════════════════════════════
// NETLIFY SUBMIT
// ═══════════════════════════════════════════════════
function shouldMockNetlifySubmit(){
  return ['localhost','127.0.0.1','[::1]'].includes(location.hostname);
}
async function doNetlifySubmit(btnId,fbId,btnLabel,payload,modalId){
  const btn=document.getElementById(btnId);
  const fb=document.getElementById(fbId);
  btn.disabled=true;btn.textContent=t('submitting');
  fb.className='submit-feedback';fb.textContent='';
  if(shouldMockNetlifySubmit()){
    console.info('[local Netlify Forms mock]',payload['form-name'],payload);
    recordPending();
    if(modalId==='add-modal')showAddSuccess();
    else{
      fb.className='submit-feedback ok';fb.textContent=t('submit_ok');
      setTimeout(()=>document.getElementById(modalId)?.classList.remove('open'),2200);
    }
    return;
  }
  try{
    const resp=await fetch('/',{method:'POST',
      headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body:new URLSearchParams(payload).toString()});
    if(resp.ok){
      recordPending();
      if(modalId==='add-modal')showAddSuccess();
      else{
        fb.className='submit-feedback ok';fb.textContent=t('submit_ok');
        setTimeout(()=>document.getElementById(modalId)?.classList.remove('open'),2200);
      }
    }else{throw new Error(resp.status)}
  }catch(e){
    fb.className='submit-feedback err';fb.textContent=t('submit_err');
    btn.disabled=false;btn.textContent=btnLabel;
  }
}
function resetFeedback(fbId,btnId,btnLabel){
  const fb=document.getElementById(fbId);fb.className='submit-feedback';fb.textContent='';
  const btn=document.getElementById(btnId);btn.disabled=false;btn.textContent=btnLabel;
}

function recordPending(){localStorage.setItem('has_pending','1');showPendingBanner()}

    document.getElementById('pending-banner').classList.add('is-visible');

// ═══════════════════════════════════════════════════
// ADMIN AUTH  — access via yoursite.netlify.app/#admin
// ═══════════════════════════════════════════════════
function checkAdminHash(){
  if(location.hash==='#admin'){
    history.replaceState(null,'',location.pathname);
    openAdminAuth();
  }
}
function openAdminAuth(){
  document.getElementById('admin-pwd').value='';
  const fb=document.getElementById('admin-feedback');
  fb.className='submit-feedback';fb.textContent='';
  document.getElementById('admin-auth-modal').classList.add('open');
  setTimeout(()=>document.getElementById('admin-pwd').focus(),100);
}
function closeAdminAuth(){document.getElementById('admin-auth-modal').classList.remove('open')}

async function verifyAdminPassword(){
  // If build.sh hasn't replaced the placeholder, admin is not configured
  if(ADMIN_HASH==='__ADMIN_HASH__'||ADMIN_HASH===''){
    const fb=document.getElementById('admin-feedback');
    fb.className='submit-feedback err';fb.textContent=t('admin_not_configured');
    return;
  }
  const pwd=document.getElementById('admin-pwd').value;
  const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(pwd));
  const hash=Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
  if(hash===ADMIN_HASH){
    closeAdminAuth();
    openSheetModal();
  }else{
    const fb=document.getElementById('admin-feedback');
    fb.className='submit-feedback err';fb.textContent=t('admin_err');
    document.getElementById('admin-pwd').value='';
    document.getElementById('admin-pwd').focus();
  }
}

// ═══════════════════════════════════════════════════
// SHEET MODAL (admin only)
// ═══════════════════════════════════════════════════
function openSheetModal(){
  document.getElementById('sheet-status').textContent='';
  document.getElementById('sheet-modal').classList.add('open');
}
function closeSheetModal(){document.getElementById('sheet-modal').classList.remove('open')}
async function saveSheet(){
  const status=document.getElementById('sheet-status');
  status.className='sheet-status';status.textContent=t('sheet_loading');
  try{
    const resp=await fetch(LOCATIONS_API);if(!resp.ok)throw new Error(resp.status);
    const parsed=parseCSV(await resp.text());
    if(!parsed||!parsed.length)throw new Error('empty');
    data=normalizeCategoryRows(parsed);
    status.className='sheet-status ok';status.textContent=t('sheet_ok',data.length);
    rebuild();setTimeout(closeSheetModal,1200);
  }catch(e){
    status.className='sheet-status err';status.textContent=t('sheet_err',e.message);
  }
}
async function tryLoadSheet(){
  const bar=document.createElement('div');bar.className='loading-bar';document.body.appendChild(bar);
  try{
    const resp=await fetch(LOCATIONS_API);if(!resp.ok)throw new Error();
    const parsed=parseCSV(await resp.text());
    if(parsed&&parsed.length)data=normalizeCategoryRows(parsed);
  }catch(e){}
  bar.remove();rebuild();
}

function rebuild(){if(map)buildMarkers();buildCatFilter();applyFilters()}
