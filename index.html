<!-- Netlify Forms detection -->
<form class="netlify-form-probe" name="issue-report" data-netlify="true" netlify-honeypot="bot-field">
  <input name="bot-field"/><textarea name="message"></textarea>
  <input name="page_url"/><input name="contact"/>
</form>

<!-- SNACKBAR -->
<div class="snackbar" id="snackbar" role="status" aria-live="polite" aria-atomic="true"></div>

<!-- APP BODY
     Map-first layout: the map fills the viewport and every control floats on
     top of it. #panel is a draggable bottom sheet below 701px (see
     src/ui/bottom-sheet.js) and a collapsible left side panel above it
     (see src/ui/side-panel.js). -->
<main class="app-body" id="app-body">
  <div id="map-wrap">
    <div id="map-loading" class="map-loading">
      <div>
        <div class="loading-spinner"></div>
        <p id="map-loading-msg" class="map-loading-msg"></p>
      </div>
    </div>
    <div id="map"></div>
  </div>

  <!-- FLOATING SEARCH + FILTER CHIPS -->
  <div class="map-top" id="map-top">
    <div class="search-bar" role="search">
      <button type="button" class="search-bar-btn" id="menu-btn"
        aria-haspopup="dialog" aria-controls="side-menu" aria-expanded="false"
        data-i18n-aria="menu_open">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <input class="search-input" id="search" type="search" autocomplete="off"
        enterkeyhint="search" data-i18n-ph="search_ph" data-i18n-aria="search_label"/>
      <button type="button" class="search-bar-btn search-clear-btn" id="search-clear-btn"
        data-i18n-aria="search_clear" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
      </button>
      <button class="search-bar-btn fav-filter-btn" id="fav-filter-btn" aria-pressed="false" aria-label="我的最愛">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
      </button>
    </div>
    <div class="chip-row" id="chip-row">
      <button class="chip filter-open-btn" id="filter-open-btn" type="button"
        aria-haspopup="dialog" aria-controls="filter-sheet" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg>
        <span data-i18n="filter_btn"></span>
        <span class="filter-count-badge" id="filter-count-badge" hidden></span>
      </button>
      <button class="chip dest-chip" id="dest-chip" type="button"
        aria-haspopup="dialog" aria-controls="filter-sheet">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21Z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
        <span id="dest-chip-label"></span>
      </button>
      <!-- Collection and category chips, rendered by src/features/filter-chips.js -->
      <div class="chip-list" id="filter-chips" role="group" data-i18n-aria="quick_filters"></div>
    </div>
  </div>

  <!-- RESULTS PANEL: bottom sheet on mobile, side panel on desktop -->
  <section class="panel" id="panel" data-view="results" data-i18n-aria="panel_label">
    <div class="sheet-grip" id="sheet-grip">
      <button type="button" class="sheet-handle-btn" id="sheet-handle"
        aria-controls="panel" aria-expanded="false" data-i18n-aria="sheet_expand">
        <span class="sheet-handle" aria-hidden="true"></span>
      </button>
    </div>
    <div class="panel-view panel-results" id="panel-results">
      <div class="result-meta" id="result-meta">
        <span class="result-info" id="result-info"></span>
        <span class="last-updated" id="last-updated"></span>
      </div>
      <div class="loc-list" id="loc-list"></div>
    </div>
    <article class="panel-view place-detail" id="place-detail" aria-labelledby="place-detail-title" hidden>
      <div class="place-detail-bar" id="place-detail-bar">
        <button type="button" class="place-detail-back" id="place-detail-back">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6 9 12l6 6"/></svg>
          <span data-i18n="back_to_results"></span>
        </button>
      </div>
      <div class="place-detail-body" id="place-detail-body"></div>
    </article>
    <button type="button" class="panel-toggle" id="panel-toggle"
      aria-controls="panel" aria-expanded="true" data-i18n-aria="panel_collapse">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 7l-5 5 5 5"/></svg>
    </button>
  </section>

  <!-- MAP CONTROLS -->

      </svg>
    </button>
  </div>
</main>

            <label class="filter-field-label" for="label-filter" data-i18n="label_filter"></label>
            <div class="label-filter">
              <select class="filter-sel" id="label-filter" data-i18n-aria="label_filter"></select>
              <button class="label-info-btn" id="label-info-btn" type="button"
                data-i18n-aria="collection_info_btn" aria-expanded="false"
                aria-haspopup="dialog" aria-controls="label-info-popover">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <circle cx="12" cy="12" r="9"></circle>
                  <path d="M12 11v5M12 8h.01"></path>
                </svg>
              </button>
              <div class="label-info-popover" id="label-info-popover" role="dialog"
                aria-labelledby="label-info-title" hidden>
                <div class="label-info-head">
                  <strong id="label-info-title" data-i18n="collection_info_title"></strong>
                  <button class="label-info-close" id="label-info-close" type="button"
                    data-i18n-aria="collection_info_close">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"></path></svg>
                  </button>
                </div>
                <dl class="label-info-list">
                  <div class="label-info-item">
                    <dt><span class="badge b-label">LingOrm</span></dt>
                    <dd data-i18n="collection_info_lingorm"></dd>
                  </div>
                  <div class="label-info-item">
                    <dt><span class="badge b-label" data-i18n="collection_label_jkr_picks"></span></dt>
                    <dd data-i18n="collection_info_jkr_picks"></dd>
                  </div>
                  <div class="label-info-item">
                    <dt><span class="badge b-label" data-i18n="collection_label_jkr_projects"></span></dt>
                    <dd data-i18n="collection_info_jkr_projects"></dd>
                  </div>
                  <div class="label-info-item">
                    <dt><span class="badge b-label" data-i18n="collection_label_admin"></span></dt>
                    <dd data-i18n="collection_info_admin"></dd>
                  </div>
                  <div class="label-info-item">
                    <dt><span class="badge b-exchange" data-i18n="category_currency_exchange"></span></dt>
                    <dd data-i18n="collection_info_currency_exchange"></dd>
                  </div>
                </dl>
              </div>
            </div>
          </div>
          <div class="filter-field">
            <span class="filter-field-label" data-i18n="dest_filter"></span>
            <div class="destination-filter">
              <button class="dest-filter-btn" id="dest-filter-btn" type="button"
                aria-haspopup="dialog" aria-expanded="false" aria-controls="dest-filter-menu">
                <span id="dest-filter-label"></span>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5z"/></svg>
              </button>
              <div class="dest-filter-menu" id="dest-filter-menu" role="dialog"
                aria-labelledby="dest-filter-label" hidden>
                <div class="dest-filter-head">
                  <span data-i18n="dest_filter"></span>
                  <button class="dest-filter-clear" id="dest-filter-clear" type="button"
                    data-i18n="clear"></button>
                </div>
                <label class="dest-option dest-all-option">
                  <input type="checkbox" id="dest-filter-all">
                  <span class="dest-check" aria-hidden="true"></span>
                  <span data-i18n="all_destinations"></span>
                </label>
                <div class="dest-filter-groups" id="dest-filter-groups"></div>
              </div>
            </div>
          </div>
        </div>
        <div class="exchange-toolbar">
          <label class="exchange-sort-label" for="exchange-sort" id="exchange-sort-label" data-i18n="fx_sort_label" hidden></label>
          <select class="filter-sel exchange-sort" id="exchange-sort" aria-describedby="exchange-sort-hint" hidden>
            <option value="default" data-i18n="fx_sort_default"></option>
            <option value="USD_100" data-i18n="fx_sort_usd_100"></option>
            <option value="USD_50" data-i18n="fx_sort_usd_50"></option>
            <option value="TWD" data-i18n="fx_sort_twd"></option>
            <option value="USD_1965" data-i18n="fx_sort_usd_1965"></option>
            <option value="TWD_1965" data-i18n="fx_sort_twd_1965"></option>
          </select>
          <p class="exchange-sort-hint" id="exchange-sort-hint" data-i18n="fx_sort_scope" hidden></p>
        </div>
      </div>
    </div>
    <div class="filter-sheet-foot">
      <button class="filter-sheet-done" id="filter-sheet-done" type="button"></button>
    </div>
  </div>
</dialog>

<!-- MODAL: ISSUE REPORT -->
<div class="modal-overlay" id="issue-modal">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" data-i18n="issue_title"></span>
      <button class="modal-close">✕</button>
    </div>
    <p class="modal-desc" data-i18n="issue_desc"></p>
    <div class="modal-body">
      <div class="form-row">
        <label class="form-label"><span data-i18n="issue_lbl_message"></span><span class="required-mark"> *</span></label>
        <textarea class="form-textarea" id="issue-message" rows="4" data-i18n-ph="issue_ph_message"></textarea>
      </div>
      <div class="form-row">
        <label class="form-label">
          <span data-i18n="issue_lbl_contact"></span> <span class="lbl-opt" data-i18n="opt"></span>
        </label>
        <input class="form-input" id="issue-contact" data-i18n-ph="ph_submitter"/>
      </div>
      <div class="submit-feedback" id="issue-feedback"></div>
    </div>
    <div class="modal-footer">
      <button class="btn-ghost" id="issue-cancel-btn" data-i18n="cancel"></button>
      <button class="btn-primary" id="issue-submit-btn" data-i18n="issue_submit"></button>
    </div>
  </div>
</div>

<!-- MODAL: WHAT'S NEW -->
<div class="modal-overlay" id="whats-new-modal">
  <div class="modal modal-sm">
    <div class="modal-header">
      <span class="modal-title" id="wn-title"></span>
      <button class="modal-close" id="wn-close-btn" aria-label="關閉">✕</button>
    </div>
    <p class="modal-desc" id="wn-desc"></p>
    <div class="modal-body" id="wn-list"></div>
    <div class="modal-footer">
      <a class="btn-secondary" id="wn-changelog-link" href="./changelog.html"></a>
      <button class="btn-primary" id="wn-got-it-btn"></button>
    </div>
  </div>
</div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
