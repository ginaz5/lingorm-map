<!DOCTYPE html>
<html lang="zh-TW" data-theme="auto">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>Lingorm Bangkok Map</title>
<style>
:root {
  --bg:#f5f5f7; --surface:#fff; --surface2:#f0f0f5; --border:#e0e0e8;
  --text:#1a1a2e; --text-muted:#666680;
  --accent:#6c3dff; --accent-soft:#ede8ff;
  --verified:#2e7d32; --v-bg:#e8f5e9;
  --review:#e65100; --r-bg:#fff3e0;
  --notfound:#b71c1c; --nf-bg:#ffebee;
  --card-hover:#f5f0ff;
  --header-h:52px; --tab-h:56px;
  --shadow:0 1px 4px rgba(0,0,0,.10);
  --shadow-md:0 4px 16px rgba(0,0,0,.12);
  --success:#1b5e20; --success-bg:#e8f5e9;
}
[data-theme="dark"] {
  --bg:#0f0f1a; --surface:#1a1a2e; --surface2:#12122a; --border:#2a2a4a;
  --text:#e8e8f5; --text-muted:#8080aa;
  --accent:#9d6dff; --accent-soft:#1e1440;
  --verified:#66bb6a; --v-bg:#0d2c0f;
  --review:#ffa726; --r-bg:#2c1a00;
  --notfound:#ef5350; --nf-bg:#2c0a0a;
  --card-hover:#1f1540;
  --shadow:0 1px 4px rgba(0,0,0,.4);
  --shadow-md:0 4px 20px rgba(0,0,0,.5);
  --success:#66bb6a; --success-bg:#0d2c0f;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans TC',sans-serif;
  background:var(--bg);color:var(--text);display:flex;flex-direction:column;transition:background .2s,color .2s}
a{color:var(--accent)}
/* Header */
header{height:var(--header-h);flex-shrink:0;background:var(--surface);border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 12px;gap:8px;box-shadow:var(--shadow);z-index:500;position:relative}
.logo{font-size:17px;font-weight:700;color:var(--accent);white-space:nowrap}
.logo-sub{font-size:12px;color:var(--text-muted);white-space:nowrap;display:none}
@media(min-width:480px){.logo-sub{display:block}}
.hdr-spacer{flex:1}
.hdr-btn{background:var(--surface2);border:1px solid var(--border);color:var(--text);
  padding:6px 10px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;
  white-space:nowrap;transition:all .15s;display:flex;align-items:center;gap:4px}
.hdr-btn:hover{border-color:var(--accent);color:var(--accent)}
.icon-btn{padding:6px 8px;font-size:16px}
.btn-add{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-add:hover{opacity:.85;color:#fff;border-color:var(--accent)}
/* Layout */
.app-body{flex:1;display:flex;overflow:hidden}
.panel{width:360px;min-width:300px;flex-shrink:0;background:var(--surface);
  border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
#map-wrap{flex:1;position:relative;overflow:hidden}
#map{width:100%;height:100%}
/* Filters */
.filters{padding:10px;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:7px;flex-shrink:0}
.search-wrap{position:relative}
.search-wrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;fill:var(--text-muted);pointer-events:none}
.search-input{width:100%;background:var(--surface2);border:1px solid var(--border);
  border-radius:8px;padding:8px 10px 8px 32px;color:var(--text);font-size:14px;outline:none;transition:border-color .15s}
.search-input:focus{border-color:var(--accent)}
.search-input::placeholder{color:var(--text-muted)}
.filter-row{display:flex;gap:6px}
.filter-sel{flex:1;background:var(--surface2);border:1px solid var(--border);
  border-radius:8px;padding:7px 8px;color:var(--text);font-size:13px;outline:none;cursor:pointer}
.filter-sel:focus{border-color:var(--accent)}
.result-info{font-size:11px;color:var(--text-muted);padding:0 2px}
/* Cards */
.loc-list{overflow-y:auto;flex:1;padding:8px;display:flex;flex-direction:column;gap:6px}
.loc-list::-webkit-scrollbar{width:4px}
.loc-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.loc-card{background:var(--surface2);border:1px solid var(--border);border-radius:10px;
  padding:10px 12px;cursor:pointer;transition:background .12s,border-color .12s,box-shadow .12s;
  border-left:3px solid transparent;position:relative}
.loc-card:hover{background:var(--card-hover)}
.loc-card.active{background:var(--card-hover);border-color:var(--accent);border-left-color:var(--accent);box-shadow:var(--shadow-md)}
.card-head{display:flex;align-items:flex-start;gap:8px}
.card-icon{font-size:20px;line-height:1;flex-shrink:0;margin-top:1px}
.card-name{font-size:13px;font-weight:600;color:var(--text);line-height:1.3}
.card-alt{font-size:11px;color:var(--text-muted);margin-top:2px}
.badges{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.badge{font-size:10px;font-weight:600;padding:2px 7px;border-radius:20px;border:1px solid;white-space:nowrap}
.b-cat{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.b-verified{color:var(--verified);border-color:var(--verified);background:var(--v-bg)}
.b-review{color:var(--review);border-color:var(--review);background:var(--r-bg)}
.b-notfound{color:var(--notfound);border-color:var(--notfound);background:var(--nf-bg)}
.b-dup{color:#795548;border-color:#795548;background:#efebe9}
[data-theme="dark"] .b-dup{color:#bcaaa4;border-color:#5d4037;background:#1a0f0a}
.card-notes{font-size:11px;color:var(--text-muted);margin-top:6px;line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-footer{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
.card-maplink{display:inline-flex;align-items:center;gap:3px;font-size:11px;color:var(--accent);text-decoration:none;font-weight:500}
.card-maplink:hover{text-decoration:underline}
.approx-tag{font-size:10px;color:var(--review);margin-top:4px}
.card-edit-btn{font-size:11px;color:var(--text-muted);background:none;border:1px solid var(--border);
  border-radius:6px;padding:3px 7px;cursor:pointer;white-space:nowrap;transition:all .12s;flex-shrink:0}
.card-edit-btn:hover{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.card-edit-btn.verify-hint{color:var(--review);border-color:var(--review);background:var(--r-bg)}
.card-edit-btn.verify-hint:hover{color:#fff;background:var(--review);border-color:var(--review)}
/* Map legend */
.map-legend{position:absolute;bottom:24px;right:8px;z-index:400;background:var(--surface);
  border:1px solid var(--border);border-radius:8px;padding:8px 10px;box-shadow:var(--shadow-md);font-size:11px}
.leg-row{display:flex;align-items:center;gap:6px;margin-bottom:3px}
.leg-row:last-child{margin-bottom:0}
.leg-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
/* Google Maps InfoWindow */
.gm-style .gm-style-iw-c{background:var(--surface)!important;border:1px solid var(--border)!important;
  border-radius:10px!important;box-shadow:var(--shadow-md)!important;padding:0!important}
.gm-style .gm-style-iw-d{overflow:hidden!important;padding:12px 14px!important}
.gm-style .gm-style-iw-t::after,.gm-style .gm-style-iw-tc::after{background:var(--surface)!important}
button.gm-ui-hover-effect span{background-color:var(--text-muted)!important}
/* Popup content (shared classes used in InfoWindow HTML) */
.leaflet-popup-content-wrapper{background:var(--surface)!important;color:var(--text)!important;
  border:1px solid var(--border)!important;border-radius:10px!important;box-shadow:var(--shadow-md)!important}
.leaflet-popup-tip{background:var(--surface)!important}
.popup-name{font-size:14px;font-weight:700;margin-bottom:4px}
.popup-alt{font-size:12px;color:var(--text-muted);margin-bottom:6px}
.popup-notes{font-size:12px;color:var(--text-muted);line-height:1.5;margin:6px 0 8px}
/* Mobile */
.tab-bar{display:none;height:var(--tab-h);flex-shrink:0;background:var(--surface);
  border-top:1px solid var(--border);box-shadow:0 -1px 4px rgba(0,0,0,.1);z-index:300}
.tab-btn{flex:1;background:none;border:none;cursor:pointer;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:3px;font-size:11px;color:var(--text-muted);
  font-weight:600;padding:6px 0;transition:color .15s}
.tab-btn.active{color:var(--accent)}
.tab-btn svg{width:22px;height:22px;fill:currentColor}
@media(max-width:700px){
  .panel{width:100%;border-right:none}
  .app-body{flex-direction:column}
  .tab-bar{display:flex}
  .panel[data-mobile-tab="map"]{display:none}
  #map-wrap[data-mobile-tab="list"]{display:none}
  .logo-sub{display:none}
}
/* Modals (shared) */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);
  z-index:1000;align-items:center;justify-content:center;padding:16px}
.modal-overlay.open{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:14px;
  padding:22px 22px 18px;width:100%;max-width:500px;box-shadow:var(--shadow-md);
  max-height:90vh;display:flex;flex-direction:column}
.modal-sm{max-width:380px}
.modal-header{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.modal-title{font-size:16px;font-weight:700;flex:1}
.modal-close{background:none;border:none;font-size:20px;cursor:pointer;color:var(--text-muted);padding:0 4px;line-height:1}
.modal-close:hover{color:var(--text)}
.modal-desc{font-size:13px;color:var(--text-muted);margin-bottom:16px;line-height:1.5}
.modal-body{overflow-y:auto;flex:1;padding-right:2px}
.modal-body::-webkit-scrollbar{width:4px}
.modal-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.form-row{margin-bottom:13px}
.form-label{font-size:12px;font-weight:600;display:block;margin-bottom:5px;color:var(--text-muted)}
.lbl-opt{font-weight:400}
.form-input,.form-textarea,.form-select{width:100%;background:var(--surface2);border:1px solid var(--border);
  border-radius:8px;padding:8px 10px;color:var(--text);font-size:13px;
  outline:none;transition:border-color .15s;font-family:inherit}
.form-input:focus,.form-textarea:focus,.form-select:focus{border-color:var(--accent)}
.form-input::placeholder,.form-textarea::placeholder{color:var(--text-muted)}
.form-textarea{resize:vertical;min-height:60px;line-height:1.5}
.form-select{cursor:pointer}
.form-2col{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-hint{font-size:11px;color:var(--text-muted);margin-top:4px;line-height:1.4}
.form-divider{border:none;border-top:1px solid var(--border);margin:14px 0}
.modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;
  padding-top:14px;border-top:1px solid var(--border);flex-shrink:0}
.btn-primary{background:var(--accent);color:#fff;border:none;padding:9px 20px;
  border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;transition:opacity .15s}
.btn-primary:hover{opacity:.85}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.btn-ghost{background:none;border:1px solid var(--border);color:var(--text);
  padding:9px 16px;border-radius:8px;cursor:pointer;font-size:13px}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent)}
/* Status radio pills */
.status-opts{display:flex;gap:6px;flex-wrap:wrap}
.status-opt{display:none}
.status-opt+label{padding:5px 12px;border-radius:20px;border:1px solid var(--border);
  font-size:12px;font-weight:600;cursor:pointer;transition:all .12s;background:var(--surface2);color:var(--text-muted)}
.status-opt:checked+label{border-width:2px}
#so-verified:checked+label,#ns-verified:checked+label{color:var(--verified);border-color:var(--verified);background:var(--v-bg)}
#so-review:checked+label,#ns-review:checked+label{color:var(--review);border-color:var(--review);background:var(--r-bg)}
#so-notfound:checked+label,#ns-notfound:checked+label{color:var(--notfound);border-color:var(--notfound);background:var(--nf-bg)}
/* Feedback */
.submit-feedback{font-size:13px;padding:10px 12px;border-radius:8px;margin-top:10px;display:none;line-height:1.4}
.submit-feedback.ok{display:block;background:var(--success-bg);color:var(--success);border:1px solid var(--verified)}
.submit-feedback.err{display:block;background:var(--nf-bg);color:var(--notfound);border:1px solid var(--notfound)}
/* Sheet status */
.sheet-status{font-size:11px;padding:4px 0}
.sheet-status.ok{color:var(--verified)}
.sheet-status.err{color:var(--notfound)}
/* Loading bar */
.loading-bar{position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--accent) 0%,#c084fc 100%);
  z-index:1000;animation:loading 1.2s ease-in-out infinite}
@keyframes loading{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
/* Empty state */
.empty{text-align:center;color:var(--text-muted);padding:40px 20px}
.empty-icon{font-size:32px;margin-bottom:8px}
/* Pending banner */
.pending-banner{font-size:12px;background:var(--r-bg);color:var(--review);
  border-bottom:1px solid var(--review);padding:7px 14px;
  display:flex;align-items:center;gap:6px;flex-shrink:0}
</style>
</head>
<body>

<!-- Netlify Forms detection -->
<form name="suggest-edit" data-netlify="true" netlify-honeypot="bot-field" style="display:none">
  <input name="bot-field"/><input name="location_name"/><input name="location_index"/>
  <input name="suggested_status"/><input name="maps_query"/><input name="lat"/><input name="lng"/>
  <textarea name="notes_zh"></textarea><textarea name="notes_en"></textarea>
  <textarea name="reason"></textarea><input name="submitter"/>
</form>
<form name="add-location" data-netlify="true" netlify-honeypot="bot-field" style="display:none">
  <input name="bot-field"/><input name="name_zh"/><input name="name_en"/><input name="alt_name"/>
  <input name="icon"/><input name="category_zh"/><input name="category_en"/>
  <input name="lat"/><input name="lng"/><input name="maps_query"/>
  <textarea name="notes_zh"></textarea><textarea name="notes_en"></textarea>
  <input name="source_url"/><input name="submitter"/>
</form>

<!-- HEADER -->
<header>
  <span class="logo">🗺 Lingorm BKK</span>
  <div class="hdr-spacer"></div>
  <button class="hdr-btn btn-add" onclick="openAddModal()">
    <span>＋</span><span data-i18n="add_loc"></span>
  </button>
  <button class="hdr-btn" id="lang-btn" onclick="toggleLang()"></button>
  <button class="hdr-btn icon-btn" id="theme-btn" onclick="cycleTheme()">🌙</button>
</header>

<!-- Pending banner -->
<div class="pending-banner" id="pending-banner" style="display:none">
  <span>⏳</span><span data-i18n="pending_notice"></span>
</div>

<!-- APP BODY -->
<div class="app-body">
  <div class="panel" id="panel" data-mobile-tab="list">
    <div class="filters">
      <div class="search-wrap">
        <svg viewBox="0 0 24 24"><path d="M10 2a8 8 0 1 1 0 16A8 8 0 0 1 10 2Zm0 2a6 6 0 1 0 0 12A6 6 0 0 0 10 4Zm8.586 12.172 2.828 2.828-1.414 1.414-2.828-2.828 1.414-1.414Z"/></svg>
        <input class="search-input" id="search" type="search" data-i18n-ph="search_ph" oninput="applyFilters()"/>
      </div>
      <div class="filter-row">
        <select class="filter-sel" id="cat-filter" onchange="applyFilters()"></select>
        <select class="filter-sel" id="status-filter" onchange="applyFilters()"></select>
      </div>
      <div class="result-info" id="result-info"></div>
    </div>
    <div class="loc-list" id="loc-list"></div>
  </div>
  <div id="map-wrap" data-mobile-tab="list">
    <div id="map"></div>
    <div class="map-legend">
      <div class="leg-row"><div class="leg-dot" style="background:#2e7d32"></div><span data-i18n="leg_verified"></span></div>
      <div class="leg-row"><div class="leg-dot" style="background:#e65100"></div><span data-i18n="leg_review"></span></div>
      <div class="leg-row"><div class="leg-dot" style="background:#b71c1c"></div><span data-i18n="leg_notfound"></span></div>
    </div>
  </div>
</div>

<!-- MOBILE TAB BAR -->
<div class="tab-bar">
  <button class="tab-btn" id="tab-map" onclick="switchTab('map')">
    <svg viewBox="0 0 24 24"><path d="M20.5 3l-.16.03L15 5.1 9 3 3.36 4.9c-.21.07-.36.25-.36.48V20.5c0 .28.22.5.5.5l.16-.03L9 18.9l6 2.1 5.64-1.9c.21-.07.36-.25.36-.48V3.5c0-.28-.22-.5-.5-.5zM15 19l-6-2.11V5l6 2.11V19z"/></svg>
    <span data-i18n="tab_map"></span>
  </button>
  <button class="tab-btn active" id="tab-list" onclick="switchTab('list')">
    <svg viewBox="0 0 24 24"><path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/></svg>
    <span data-i18n="tab_list"></span>
  </button>
</div>

<!-- MODAL: SUGGEST EDIT -->
<div class="modal-overlay" id="edit-modal" onclick="if(event.target===this)closeEditModal()">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" data-i18n="edit_title"></span>
      <button class="modal-close" onclick="closeEditModal()">✕</button>
    </div>
    <p class="modal-desc" data-i18n="edit_desc"></p>
    <div class="modal-body">
      <div class="form-row">
        <label class="form-label" data-i18n="edit_lbl_location"></label>
        <input class="form-input" id="edit-location-name" readonly style="opacity:.6;cursor:default"/>
        <input type="hidden" id="edit-location-index"/>
      </div>
      <div class="form-row">
        <label class="form-label" data-i18n="edit_lbl_status"></label>
        <div class="status-opts">
          <input class="status-opt" type="radio" name="suggest-status" id="so-verified" value="Verified"/>
          <label for="so-verified" data-i18n="st_verified"></label>
          <input class="status-opt" type="radio" name="suggest-status" id="so-review" value="Needs Review" checked/>
          <label for="so-review" data-i18n="st_review"></label>
          <input class="status-opt" type="radio" name="suggest-status" id="so-notfound" value="Could Not Find"/>
          <label for="so-notfound" data-i18n="st_notfound"></label>
        </div>
      </div>
      <div class="form-row">
        <label class="form-label">
          <span data-i18n="edit_lbl_maps"></span> <span class="lbl-opt" data-i18n="opt"></span>
        </label>
        <input class="form-input" id="edit-maps" data-i18n-ph="edit_ph_maps"/>
        <div class="form-hint" data-i18n="edit_hint_maps"></div>
      </div>
      <div class="form-2col">
        <div class="form-row">
          <label class="form-label">
            <span data-i18n="edit_lbl_lat"></span> <span class="lbl-opt" data-i18n="opt"></span>
          </label>
          <input class="form-input" id="edit-lat" type="number" step="any" placeholder="13.7466"/>
        </div>
        <div class="form-row">
          <label class="form-label">
            <span data-i18n="edit_lbl_lng"></span> <span class="lbl-opt" data-i18n="opt"></span>
          </label>
          <input class="form-input" id="edit-lng" type="number" step="any" placeholder="100.5344"/>
        </div>
      </div>
      <div class="form-hint" style="margin-top:-6px;margin-bottom:10px" data-i18n="edit_hint_coords"></div>
      <div class="form-row">
        <label class="form-label">
          <span data-i18n="edit_lbl_notes_zh"></span> <span class="lbl-opt" data-i18n="opt"></span>
        </label>
        <textarea class="form-textarea" id="edit-notes-zh" rows="2" data-i18n-ph="edit_ph_notes_zh"></textarea>
      </div>
      <div class="form-row">
        <label class="form-label">
          <span data-i18n="edit_lbl_notes_en"></span> <span class="lbl-opt" data-i18n="opt"></span>
        </label>
        <textarea class="form-textarea" id="edit-notes-en" rows="2" data-i18n-ph="edit_ph_notes_en"></textarea>
      </div>
      <div class="form-row">
        <label class="form-label">
          <span data-i18n="edit_lbl_reason"></span> <span class="lbl-opt" data-i18n="opt"></span>
        </label>
        <textarea class="form-textarea" id="edit-reason" rows="2" data-i18n-ph="edit_ph_reason"></textarea>
      </div>
      <hr class="form-divider"/>
      <div class="form-row">
        <label class="form-label">
          <span data-i18n="edit_lbl_submitter"></span> <span class="lbl-opt" data-i18n="edit_lbl_submitter_opt"></span>
        </label>
        <input class="form-input" id="edit-submitter" data-i18n-ph="ph_submitter"/>
      </div>
      <div class="submit-feedback" id="edit-feedback"></div>
    </div>
    <div class="modal-footer">
      <button class="btn-ghost" onclick="closeEditModal()" data-i18n="cancel"></button>
      <button class="btn-primary" id="edit-submit-btn" onclick="submitEdit()" data-i18n="edit_submit"></button>
    </div>
  </div>
</div>

<!-- MODAL: ADD LOCATION -->
<div class="modal-overlay" id="add-modal" onclick="if(event.target===this)closeAddModal()">
  <div class="modal">
    <div class="modal-header">

// ═══════════════════════════════════════════════════
// CSV PARSER
// ═══════════════════════════════════════════════════
function parseCSV(text){
  const rows=[];let row=[];let field='';let inQ=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i],nx=text[i+1];
    if(inQ){if(ch==='"'&&nx==='"'){field+='"';i++}else if(ch==='"'){inQ=false}else{field+=ch}}
    else{if(ch==='"'){inQ=true}else if(ch===','){row.push(field);field=''}
      else if(ch==='\r'&&nx==='\n'){row.push(field);rows.push(row);row=[];field='';i++}
      else if(ch==='\n'||ch==='\r'){row.push(field);rows.push(row);row=[];field=''}
      else{field+=ch}}
  }
  if(field||row.length){row.push(field);rows.push(row)}
  if(rows.length<2)return null;
  const headers=rows[0].map(h=>h.trim());
  const idx={};headers.forEach((h,i)=>idx[h]=i);
  const keys=["Name_EN","Name_ZH","Alt_Name","Category_EN","Category_ZH",
              "Notes_EN","Notes_ZH","Icon","Lat","Lng",
              "Maps_Query","Status","Duplicate_Group","Source","Coords_Approx"];
  if(!keys.every(k=>idx[k]!==undefined))return null;
  return rows.slice(1).filter(r=>r.join('').trim()).map(r=>
    keys.map(k=>(idx[k]!==undefined?r[idx[k]]||'':'').trim()));
}

// STATE

let data=EMBEDDED, visIdx=[], activeIdx=-1;

// ═══════════════════════════════════════════════════
// MAP (Google Maps JS API)
// ═══════════════════════════════════════════════════
let map = null;
let infoWindow = null;
const markers = [];

function getEffectiveTheme(){
  const s=localStorage.getItem('theme')||'auto';
  return s==='auto'?(window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):s;
}
function updateMapTheme(){
  if(!map)return;
  map.setOptions({colorScheme:getEffectiveTheme()==='dark'?'DARK':'LIGHT'});
}
function makeMarkerContent(status){
  const c={Verified:'#2e7d32','Needs Review':'#e65100','Could Not Find':'#b71c1c'}[status]||'#e65100';
  const el=document.createElement('div');
  el.style.cssText=`width:14px;height:14px;border-radius:50%;background:${c};border:2px solid rgba(255,255,255,.85);box-shadow:0 2px 6px rgba(0,0,0,.4)`;
  return el;
}
function buildPopupContent(i){
  const row=data[i];
  const name=lang==='zh'?row[C.ZH]:row[C.EN];
  const notes=lang==='zh'?row[C.NOTES_ZH]:row[C.NOTES_EN];
  const cat=lang==='zh'?row[C.CAT_ZH]:row[C.CAT_EN];
  return `<div style="min-width:200px;max-width:260px">
    <div class="popup-name">${row[C.ICON]} ${name}</div>
    ${row[C.ALT]?`<div class="popup-alt">${row[C.ALT]}</div>`:''}
    <div class="badges" style="margin-bottom:6px">
      <span class="badge b-cat">${cat}</span>
      <span class="badge ${getBadgeClass(row[C.STATUS])}">${tobj('badge',row[C.STATUS])}</span>
    </div>
    <div class="popup-notes">${notes}</div>
  </div>`;
}
function buildMarkers(){
  if(!map)return;
  markers.forEach(m=>{if(m)m.map=null});markers.length=0;
  data.forEach((row,i)=>{
    const lat=parseFloat(row[C.LAT]),lng=parseFloat(row[C.LNG]);
    if(!lat||!lng)return;
    const m=new google.maps.marker.AdvancedMarkerElement({
      map,position:{lat,lng},content:makeMarkerContent(row[C.STATUS])
    });
    m.addListener('click',()=>{
      infoWindow.setContent(buildPopupContent(i));
      infoWindow.open({anchor:m,map});
      activateCard(i);
      if(window.innerWidth<=700)switchTab('list');
    });
    markers[i]=m;
  });
}

// Called by Google Maps script after it loads
window.initMapCallback=function(){
  map=new google.maps.Map(document.getElementById('map'),{
    center:{lat:13.82,lng:100.52},zoom:11,
    mapId:'__GOOGLE_MAP_ID__',
    colorScheme:getEffectiveTheme()==='dark'?'DARK':'LIGHT',
    zoomControlOptions:{position:google.maps.ControlPosition.RIGHT_CENTER}
  });
  infoWindow=new google.maps.InfoWindow();
  buildMarkers();
};

// ═══════════════════════════════════════════════════
// CARD LIST
// ═══════════════════════════════════════════════════
function getBadgeClass(s){
  if(s==='Verified')return 'b-verified';
  if(s==='Could Not Find')return 'b-notfound';
  return 'b-review';
}
function applyFilters(){
  const q=document.getElementById('search').value.toLowerCase();
  const cat=document.getElementById('cat-filter').value;
  const st=document.getElementById('status-filter').value;
  visIdx=[];
  data.forEach((row,i)=>{
    const nameHit=(row[C.EN]+row[C.ZH]+row[C.ALT]).toLowerCase().includes(q);
    const notesHit=(row[C.NOTES_EN]+row[C.NOTES_ZH]).toLowerCase().includes(q);
    // cat filter: compare against both zh and en to handle sheet-loaded data
    const catVal=lang==='zh'?row[C.CAT_ZH]:row[C.CAT_EN];
    const catHit=!cat||catVal===cat;
    const stHit=!st||row[C.STATUS]===st;
    if((nameHit||notesHit)&&catHit&&stHit)visIdx.push(i);
  });
  renderList();
  document.getElementById('result-info').textContent=t('count',visIdx.length,data.length);
}
function renderList(){
  const list=document.getElementById('loc-list');
  if(!visIdx.length){list.innerHTML=`<div class="empty"><div class="empty-icon">🔍</div>${t('empty')}</div>`;return}
  list.innerHTML=visIdx.map(i=>{
    const row=data[i];
    const name=lang==='zh'?row[C.ZH]:row[C.EN];
    const notes=lang==='zh'?row[C.NOTES_ZH]:row[C.NOTES_EN];
    const cat=lang==='zh'?row[C.CAT_ZH]:row[C.CAT_EN];
    const st=row[C.STATUS];
    const needsHelp=st==='Needs Review'||st==='Could Not Find';
    return `<div class="loc-card${activeIdx===i?' active':''}" id="card-${i}" onclick="activateCard(${i})">
      <div class="card-head">
        <div class="card-icon">${row[C.ICON]}</div>
        <div style="flex:1;min-width:0">
          <div class="card-name">${name}</div>
          ${row[C.ALT]?`<div class="card-alt">${row[C.ALT]}</div>`:''}
        </div>
      </div>
      <div class="badges">
        <span class="badge b-cat">${cat}</span>
        <span class="badge ${getBadgeClass(st)}">${tobj('badge',st)}</span>
        ${row[C.DUP]?`<span class="badge b-dup">${row[C.DUP]}</span>`:''}
      </div>
      <div class="card-notes">${notes}</div>
      ${row[C.APPROX]==='TRUE'?`<div class="approx-tag">${t('approx')}</div>`:''}
      <div class="card-footer">
        <span></span>
        <button class="card-edit-btn${needsHelp?' verify-hint':''}"
          onclick="event.stopPropagation();openEditModal(${i})">
          ${needsHelp?t('edit_btn_verify'):t('edit_btn_edit')}
        </button>
      </div>
    </div>`;
  }).join('');
}
function activateCard(i){
  activeIdx=i;
  const row=data[i];
  const lat=parseFloat(row[C.LAT]),lng=parseFloat(row[C.LNG]);
  if(lat&&lng&&map){
    map.panTo({lat,lng});map.setZoom(15);
    if(markers[i]){infoWindow.setContent(buildPopupContent(i));infoWindow.open({anchor:markers[i],map});}
  }
  document.querySelectorAll('.loc-card').forEach(c=>c.classList.remove('active'));
  const card=document.getElementById('card-'+i);
  if(card){card.classList.add('active');card.scrollIntoView({behavior:'smooth',block:'nearest'})}
}

// ═══════════════════════════════════════════════════
function toggleLang(){
  lang=lang==='zh'?'en':'zh';localStorage.setItem('lang',lang);
  updateLangUI();
  buildCatFilter();buildCatDropdown();
  applyFilters();
  if(infoWindow&&activeIdx>=0&&markers[activeIdx]){infoWindow.setContent(buildPopupContent(activeIdx));}
}

function updateLangUI(){
  // data-i18n: textContent
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const v=t(el.dataset.i18n);
    if(v!==el.dataset.i18n)el.textContent=v;
  });
  // data-i18n-html: innerHTML
  document.querySelectorAll('[data-i18n-html]').forEach(el=>{
    const v=t(el.dataset.i18nHtml);
    if(v!==el.dataset.i18nHtml)el.innerHTML=v;
  });
  // data-i18n-ph: placeholder
  document.querySelectorAll('[data-i18n-ph]').forEach(el=>{
    const v=t(el.dataset.i18nPh);
    if(v!==el.dataset.i18nPh)el.placeholder=v;
  });
  // lang button
  document.getElementById('lang-btn').textContent=t('lang_btn');
  // status filter rebuild
  buildStatusFilter();
}

function buildStatusFilter(){
  const sf=document.getElementById('status-filter');
  const prev=sf.value;
  sf.innerHTML=`<option value="">${t('all_status')}</option>`+
    Object.entries(t('status')).map(([k,v])=>`<option value="${k}">${v}</option>`).join('');
  sf.value=prev;
}

function buildCatFilter(){
  const sel=document.getElementById('cat-filter');
  const prev=sel.value;
  const cats=new Set();
  data.forEach(r=>cats.add(lang==='zh'?r[C.CAT_ZH]:r[C.CAT_EN]));
  sel.innerHTML=`<option value="">${t('all_cat')}</option>`+
    [...cats].sort().map(c=>`<option value="${c}">${c}</option>`).join('');
  sel.value=prev;
}

function buildCatDropdown(){
  const sel=document.getElementById('add-cat');
  const prev=sel.value;
  sel.innerHTML=CATEGORIES.map(c=>
    `<option value="${c.en}">${c.icon} ${lang==='zh'?c.zh:c.en}</option>`
  ).join('');
  if(prev)sel.value=prev;
}

const THEME_ICONS={light:'☀️',dark:'🌙',auto:'🌓'};
function cycleTheme(){
  const cur=localStorage.getItem('theme')||'auto';
  localStorage.setItem('theme',cur==='auto'?'light':cur==='light'?'dark':'auto');
  applyTheme();
}
function applyTheme(){
  document.documentElement.setAttribute('data-theme',getEffectiveTheme());
  document.getElementById('theme-btn').textContent=THEME_ICONS[localStorage.getItem('theme')||'auto'];
  updateMapTheme();
}
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{
  if((localStorage.getItem('theme')||'auto')==='auto')applyTheme();
});

// ═══════════════════════════════════════════════════
// NETLIFY SUBMIT
// ═══════════════════════════════════════════════════
async function doNetlifySubmit(btnId,fbId,btnLabel,payload,modalId){
  const btn=document.getElementById(btnId);
  const fb=document.getElementById(fbId);
  btn.disabled=true;btn.textContent=t('submitting');
  fb.className='submit-feedback';fb.textContent='';
  try{
    const resp=await fetch('/',{method:'POST',
      headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body:new URLSearchParams(payload).toString()});
    if(resp.ok){
      fb.className='submit-feedback ok';fb.textContent=t('submit_ok');
      recordPending();
      setTimeout(()=>document.getElementById(modalId)?.classList.remove('open'),2200);
    }else{throw new Error(resp.status)}
  }catch(e){
    fb.className='submit-feedback err';fb.textContent=t('submit_err');
    btn.disabled=false;btn.textContent=btnLabel;
  }
}
function resetFeedback(fbId,btnId,btnLabel){
  const fb=document.getElementById(fbId);fb.className='submit-feedback';fb.textContent='';
  const btn=document.getElementById(btnId);btn.disabled=false;btn.textContent=btnLabel;
}

// ═══════════════════════════════════════════════════
// PENDING BANNER
// ═══════════════════════════════════════════════════
function recordPending(){localStorage.setItem('has_pending','1');showPendingBanner()}
function showPendingBanner(){
  if(localStorage.getItem('has_pending')==='1')
    document.getElementById('pending-banner').style.display='flex';
}

// ═══════════════════════════════════════════════════
// ADMIN AUTH  — access via yoursite.netlify.app/#admin
// ═══════════════════════════════════════════════════
function checkAdminHash(){
  if(location.hash==='#admin'){
    history.replaceState(null,'',location.pathname);
    openAdminAuth();
  }
}
function openAdminAuth(){
  document.getElementById('admin-pwd').value='';
  const fb=document.getElementById('admin-feedback');
  fb.className='submit-feedback';fb.textContent='';
  document.getElementById('admin-auth-modal').classList.add('open');
  setTimeout(()=>document.getElementById('admin-pwd').focus(),100);
}
function closeAdminAuth(){document.getElementById('admin-auth-modal').classList.remove('open')}

async function verifyAdminPassword(){
  // If build.sh hasn't replaced the placeholder, admin is not configured
  if(ADMIN_HASH==='__ADMIN_HASH__'||ADMIN_HASH===''){
    const fb=document.getElementById('admin-feedback');
    fb.className='submit-feedback err';fb.textContent=t('admin_not_configured');
    return;
  }
  const pwd=document.getElementById('admin-pwd').value;
  const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(pwd));
  const hash=Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
  if(hash===ADMIN_HASH){
    closeAdminAuth();
    openSheetModal();
  }else{
    const fb=document.getElementById('admin-feedback');
    fb.className='submit-feedback err';fb.textContent=t('admin_err');
    document.getElementById('admin-pwd').value='';
    document.getElementById('admin-pwd').focus();
  }
}

// ═══════════════════════════════════════════════════
// SHEET MODAL (admin only)
// ═══════════════════════════════════════════════════
function openSheetModal(){
  document.getElementById('sheet-status').textContent='';
  document.getElementById('sheet-modal').classList.add('open');
}
function closeSheetModal(){document.getElementById('sheet-modal').classList.remove('open')}
async function saveSheet(){
  const status=document.getElementById('sheet-status');
  status.className='sheet-status';status.textContent=t('sheet_loading');
  try{
    const resp=await fetch(LOCATIONS_API);if(!resp.ok)throw new Error(resp.status);
    const parsed=parseCSV(await resp.text());
    if(!parsed||!parsed.length)throw new Error('empty');
    data=parsed;
    status.className='sheet-status ok';status.textContent=t('sheet_ok',data.length);
    rebuild();setTimeout(closeSheetModal,1200);
  }catch(e){
    status.className='sheet-status err';status.textContent=t('sheet_err',e.message);
  }
}
function clearSheet(){
  data=EMBEDDED;
  document.getElementById('sheet-status').className='sheet-status';
  document.getElementById('sheet-status').textContent=t('sheet_cleared');
  rebuild();
}
async function tryLoadSheet(){
  const bar=document.createElement('div');bar.className='loading-bar';document.body.appendChild(bar);
  try{
    const resp=await fetch(LOCATIONS_API);if(!resp.ok)throw new Error();
    const parsed=parseCSV(await resp.text());
    if(parsed&&parsed.length)data=parsed;
  }catch(e){}
  bar.remove();rebuild();
}

function rebuild(){if(map)buildMarkers();buildCatFilter();applyFilters()}
