[build]
  command = "bash build.sh && npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = ["data/locations.csv", "data/superrich-branches.json"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[build.environment]
  NODE_VERSION = "22.12.0"
  # Set runtime secrets in Netlify Dashboard:
  # Site Settings → Environment Variables → Add variable
  # Required: HERE_API_KEY
  # Data: DATA_SOURCE=notion (default; only supported value — sheet is retired)
  # Optional: GOOGLE_MAPS_KEY, GOOGLE_MAP_ID
  # Exchange rates: EXCHANGE_RATES_ENABLED must be exactly true or false — any
  # other value makes /api/exchange-rates return 503 invalid_configuration.
  # It is only the fallback default used until a runtime control exists in
  # Blobs; day-to-day on/off is `npm run fx:control -- enable|disable` (takes
  # effect immediately, no redeploy). Changing this variable needs a redeploy.
