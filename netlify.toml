[build]
  command = "bash build.sh && npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[build.environment]
  # Set runtime secrets in Netlify Dashboard:
  # Site Settings → Environment Variables → Add variable
  # Required: GOOGLE_MAPS_KEY, GOOGLE_MAP_ID, GOOGLE_SHEET_CSV_URL
  # Optional: ADMIN_PASSWORD
