[build]
  command = "bash build.sh && npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = ["data/locations.csv"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[build.environment]
  # Set runtime secrets in Netlify Dashboard:
  # Site Settings → Environment Variables → Add variable
  # Required: HERE_API_KEY
  # Data: DATA_SOURCE=notion (default; only supported value — sheet is retired)
  # Optional: GOOGLE_MAPS_KEY, GOOGLE_MAP_ID
