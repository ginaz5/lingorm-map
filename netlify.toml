[build]
  command = "bash build.sh && npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = ["data/locations.csv", "data/superrich-branches.json", "data/superrich1965-branches.json"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[build.environment]
  NODE_VERSION = "22.12.0"
  # Set runtime secrets in Netlify Dashboard:
  # Site Settings → Environment Variables → Add variable
  # Required: HERE_API_KEY
  # Data: DATA_SOURCE=notion (default; only supported value — sheet is retired)
  # Optional: GOOGLE_MAPS_KEY, GOOGLE_MAP_ID
  # Exchange rates: EXCHANGE_RATES_ENABLED is intentionally unset/false until M3
  # Orange: EXCHANGE_RATES_1965_ENABLED remains unset/false until separate approval.
